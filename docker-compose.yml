name: message-gateway

services:
  message-gateway:
    image: ghcr.io/bitnp/message-gateway:${MESSAGE_GATEWAY_IMAGE_TAG:-latest}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8081"
      MESSAGE_GATEWAY_API_KEY: "${MESSAGE_GATEWAY_API_KEY:?set MESSAGE_GATEWAY_API_KEY in .env}"
      NAPCAT_BASE_URL: "${NAPCAT_BASE_URL:-http://napcat:3001}"
    ports:
      - "127.0.0.1:${MESSAGE_GATEWAY_PORT:-8081}:8081"
    networks:
      - message-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  # Optional bundled QQ transport. Start it with:
  #   docker compose --profile bundled-napcat up -d
  # Without this profile, point NAPCAT_BASE_URL at an existing NapCat instance.
  napcat:
    profiles: ["bundled-napcat"]
    image: mlikiowa/napcat-docker:${NAPCAT_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NAPCAT_UID: "${NAPCAT_UID:-1000}"
      NAPCAT_GID: "${NAPCAT_GID:-1000}"
      NAPCAT_QUICK_ACCOUNT: "${NAPCAT_QUICK_ACCOUNT:-}"
    ports:
      - "127.0.0.1:${NAPCAT_ONEBOT_PORT:-3001}:3001"
      - "127.0.0.1:${NAPCAT_WEBUI_PORT:-6099}:6099"
    volumes:
      - "${NAPCAT_CONFIG_DIR:-./napcat/config}:/app/napcat/config:z"
      - "${NAPCAT_QQ_DIR:-./napcat/QQ}:/app/.config/QQ:z"
    networks:
      - message-gateway

networks:
  # Fixed name so clinic-backend can join it as an external network.
  message-gateway:
    name: message-gateway
