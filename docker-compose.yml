name: message-gateway

# NapCat is external to this stack. Point the account addresses in
# accounts.json at an existing NapCat instance, or use the sample stack in
# docker-compose.napcat.yml.

services:
  message-gateway:
    image: ghcr.io/bitnp/message-gateway:${MESSAGE_GATEWAY_IMAGE_TAG:-latest}
    build:
      context: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HTTP_ADDR: ":8081"
      MESSAGE_ACCOUNTS_FILE: "/etc/message-gateway/accounts.json"
    volumes:
      - "./accounts.json:/etc/message-gateway/accounts.json:ro"
    ports:
      - "127.0.0.1:${MESSAGE_GATEWAY_PORT:-8081}:8081"
    networks:
      - message-gateway
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8081/healthz"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  # Fixed name so clinic-backend can join it as an external network.
  message-gateway:
    name: message-gateway
